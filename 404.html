<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 — Sanctuary Page Not Found | Mysticink Studio</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Plus+Jakarta+Sans:wght@400;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <style>
    .error-wrapper {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 40px 24px;
      background: var(--bg-black);
    }
    .error-tag {
      font-family: var(--font-mono);
      font-size: 0.8rem;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: var(--gold-primary);
      margin-bottom: 16px;
    }
    .error-code {
      font-family: var(--font-serif);
      font-size: clamp(6rem, 18vw, 10rem);
      color: var(--text-primary);
      line-height: 1;
      margin-bottom: 12px;
      letter-spacing: 0.05em;
    }
    .error-msg {
      font-family: var(--font-serif);
      font-size: clamp(1.4rem, 3vw, 2rem);
      color: var(--gold-light);
      margin-bottom: 16px;
    }
    .error-desc {
      color: var(--text-secondary);
      max-width: 480px;
      line-height: 1.7;
      margin-bottom: 36px;
    }
  </style>
</head>
<body>
  <div class="error-wrapper">
    <span class="error-tag">Error 404 • Destination Unknown</span>
    <div class="error-code gold-gradient-text">404</div>
    <h1 class="error-msg">Path Not Found in the Himalayas</h1>
    <p class="error-desc">The sacred page or portfolio link you requested does not exist or has been moved. Return to the main sanctuary to explore our art.</p>
    <a href="index.html" class="btn btn-gold">
      Return to Studio Sanctuary
    </a>
  </div>
</body>
</html>
